name: Validate and deploy IPO Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_data.py
      - run: pytest -q
      - run: node --check app.js
      - uses: actions/configure-pages@v5
      - name: Prepare deployment site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css .nojekyll _site/
          cp data/academy.json data/cases.json data/checklist.json data/ipo_records.json data/regulatory_policy.json data/scams.json data/source_registry.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
